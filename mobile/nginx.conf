# 邻里小栈移动端 H5 nginx 配置。
# ${NGINX_PORT} / ${BACKEND_UPSTREAM} 由官方 nginx 镜像的 envsubst 在启动时注入。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${NGINX_PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 移动端使用同源 /api/v1，由这里反代到统一服务端；WebSocket 也走 /api/v1/ws。
    # ^~ 确保 /api/ 下即使路径以 .png/.pdf 结尾也不会被静态资源正则抢走。
    location ^~ /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # H5 为 hash 路由；仍保留 index.html 回退，兼容直接访问静态路径。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|svg|ico|mp4)$ {
        expires 30d;
        try_files $uri =404;
    }
}
