# 邻里小栈 Web 管理端 nginx 配置。
# 该文件由官方 nginx 镜像的 envsubst 处理，${NGINX_PORT} / ${BACKEND_UPSTREAM} 在启动时注入。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${NGINX_PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传认证材料/图片可能较大。
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 统一服务端：C 端 /api/v1、管理端 /api/v1/admin、WebSocket /api/v1/ws 都走这里。
    # ^~ 确保 /api/ 下即使路径以 .png/.pdf 结尾也不会被静态资源正则抢走。
    location ^~ /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Vue Router history 模式回退；静态资源不存在时返回 404，避免误回 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|svg|ico|mp4)$ {
        expires 30d;
        try_files $uri =404;
    }
}
