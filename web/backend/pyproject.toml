[project]
name = "neighinn-backend"
version = "0.1.0"
description = "邻里小栈统一服务端（C 端 + 管理端共享领域模型）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.1",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "pyjwt>=2.10.0",
    "redis>=5.2.1",
    "minio>=7.2.10",
    "python-multipart>=0.0.20",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
    "aiosqlite>=0.20.0",
    "httpx-ws>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "cert_materials: 使用真实认证材料归属校验（跳过存量测试夹具）",
]
